      - heading "Fjarden" [level=2] [ref=e48]
      - generic [ref=e49]:
        - paragraph [ref=e50]:
          - text: Navnet betydar
          - strong [ref=e51]: «Fjarden»
          - text: . Gammel
          - emphasis [ref=e52]: La Fjärde
          - text: blivade
          - emphasis [ref=e53]: Laphurde
          - text: ", og det gammel"
          - emphasis [ref=e54]: "-een"
          - text: "gav os navnet self: den seker fjard waar flottan av Grundsjartan ferst kastade anker."
        - paragraph [ref=e55]:
          - text: "Fyr flottar kom — Engelsk, Hollandsk, Svensk, og Fransk — og veljade te vera et folk: en nasjon"
          - strong [ref=e56]: «bindat av veljing og nit av blod»
          - text: ", als Grundlojen sejar. Du kan heera alle fyr strander in alle setning av Laphurdi."
      - generic [ref=e57]:
        - article [ref=e58]:
          - heading "Lapentieur fra Fransk «la pente» — bergen og lyset" [level=3] [ref=e59]:
            - text: Lapentieur
            - generic [ref=e60]: fra Fransk «la pente» — bergen og lyset
          - paragraph [ref=e61]: "Hovedstaden — en stad hoog over deis hamn, med mist fra zeen in morgenen. Den vit ster on flagget er lyset av Lapentieur: steren dat flottan av Grundsjartan seglade efter, hem te fjarden."
        - article [ref=e62]:
          - heading "Darcambria fra dar og Fransk «cambrer» — den dar boge" [level=3] [ref=e63]:
            - text: Darcambria
            - generic [ref=e64]:
              - text: fra
              - emphasis [ref=e65]: dar
              - text: og Fransk «cambrer» — den dar boge
          - paragraph [ref=e66]: Den sjartat storstad. Hamnen av Darcambria er self en stor boge, og in aftenlys blivar vatteren dar — det er bogen on flagget, og det er staden dat gav den deis ferg.
    - generic [ref=e68]:
      - paragraph [ref=e69]: Konsensdemokrati
      - heading "Ingen regerar over os" [level=2] [ref=e70]
      - paragraph [ref=e71]:
        - text: "Grundlojen sejar det klar in Artikel 1:"
        - emphasis [ref=e72]: «Der skal aldri vera en president, en ferste minister, en kong, el anner enkel statshoved el styringshoved.»
        - text: Laphurdeen er en parlamentisk konsensdemokrati — makten ligger med folket, og blivar brukat kollektiv, open, og under loj.
      - generic [ref=e73]:
        - generic [ref=e74]:
          - generic [ref=e75]: "0"
          - text: enkel statshoved el styringshoved — Artikel 1
        - generic [ref=e76]:
          - generic [ref=e77]: 66%
          - text: av stemmeren, in beide kamerer, for alle loj — Artikel 20
        - generic [ref=e78]:
          - generic [ref=e79]: "12"
          - text: Ministerier, alle ledat av et Ministerkollegie — Artikel 24
        - generic [ref=e80]:
          - generic [ref=e81]: 100%
          - text: av Parlamentet veljat direkt av folket — Artikel 17
      - generic [ref=e82]:
        - article [ref=e83]:
          - heading "Du veljar ministeren self" [level=3] [ref=e84]
          - paragraph [ref=e85]:
            - text: Alle Senator er en
            - strong [ref=e86]: Ledminister
            - text: ", veljat av alle folket te et navnat sete in et Ministerie (Artikel 18). Ingen utnemnar Helsaministeren hier — folket veljar hen, med navn."
        - article [ref=e87]:
          - heading "Folkskameren werkar self" [level=3] [ref=e88]
          - paragraph [ref=e89]: Tri medlemmer for alle provins, veljat med rangering — og alle medlem haldar oek et werk als ledare in et Ministerie, wen dei sittar in kameren (Artikel 19).
        - article [ref=e90]:
          - heading "Et statshoved uten makt" [level=3] [ref=e91]
          - paragraph [ref=e92]:
            - text: "Talmanen av Folkskameren er det seremoniell statshoved: hen ledar samlingeren, publiserar lojeren, og tar mot ambasadeurer — og haldar"
            - strong [ref=e93]: ingen eksekutiv makt
            - text: (Artikel 27).
        - article [ref=e94]:
          - heading "Ingen veto. For ingen." [level=3] [ref=e95]
          - paragraph [ref=e96]:
            - text: Wen beide kamerer sejar ja med 66%, blivar lojforslaget loj.
            - emphasis [ref=e97]: «Ingen person og ingen werk haldar veto over en loj av Parlamentet»
            - text: (Artikel 22). Wen kamereren staar fast, sejar folket sist — in en folkstemming dat bindar (Artikel 21).
        - article [ref=e98]:
          - heading "Open offentlig liv" [level=3] [ref=e99]
          - paragraph [ref=e100]: Alle medlem av Parlamentet haldar et open register av egendom, inkomst, og gaver; alle lobbying blivar skrivat open; alle penger in valgkampanjer blivar publiserat direkt — og en fri Integritetskommisjon kan leta gennem alle, oek domarer (Artikeleren 32–33).
        - article [ref=e101]:
          - heading "Og du kan senda dem hem" [level=3] [ref=e102]
          - paragraph [ref=e103]: Stemmareren kan senda hem alle medlem av Parlamentet — ferst med en skrift, dan med en stemming (Artikel 23). Konsens levar hier alle dager, nit bara ved valger.
