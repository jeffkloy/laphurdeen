    - generic [ref=e149]:
      - paragraph [ref=e150]: Grundloj-garantier for resare
      - heading "Rekter du kan kenna on ferie" [level=2] [ref=e151]
      - generic [ref=e152]:
        - article [ref=e153]:
          - heading "Prisen du seer er alle prisen" [level=3] [ref=e154]
          - paragraph [ref=e155]: Seljing-skatten staar in alle pris dat blivar visat el sejat — det sejar Grundlojen self (Art. 35(4)). Nummeret on menyen er nummeret du betalar; ingen skatt kommar on ved el efter betalingen.
        - article [ref=e156]:
          - heading "Du behovar ingen bil" [level=3] [ref=e157]
          - paragraph [ref=e158]: "Offentlig transport er en rekt: den kommar ofta, er seker og billig, og staar open for alle — med priser under en tak settat av lojen (Art. 14). Og ja: ferjeren er oek med."
        - article [ref=e159]:
          - heading "Kr. 100 = US$ 1 — alltid" [level=3] [ref=e160]
          - paragraph [ref=e161]: Kronan staar fast ved hundra kronur te en US-dollar (Art. 38). En lunsj ved hamnen for Kr. 450 er $4,50. Dela med hundra — og kopa mer bier.
        - article [ref=e162]:
          - heading "Twe spraker, et folk" [level=3] [ref=e163]
          - paragraph [ref=e164]: Laphurdi er det nasjonal sprak; Engelsk er oek offisiell (Art. 4). Alle offentlig informasjon kommar in beide spraker. Men prova din Laphurdi — den opnar dorer.
