    - generic [ref=e113]:
      - paragraph [ref=e114]: Frihed, Velvard, Konsens
      - heading "Tri ord on alle kronur" [level=2] [ref=e115]
      - paragraph [ref=e116]: Motto av Samveldet er mer als bela ord — det er hjertat av Grundlojen self.
      - generic [ref=e117]:
        - article [ref=e118]:
          - heading "Frihed freedom" [level=3] [ref=e119]
          - list [ref=e120]:
            - listitem [ref=e121]: "★ Ingen straff for ord: ingen brott for ord mot relisjon el mot hoog personer, aldri (Art. 7)."
            - listitem [ref=e122]: ★ Pressen er fri, mange, og olik — og journalister har rekt te skydda deis kellar (Art. 7).
            - listitem [ref=e123]: ★ Overvaking av alle folket, bred og uten maal, er forbidat (Art. 9).
            - listitem [ref=e124]: "★ Tro wat du vil — el ingen tro: Samveldet har ingen relisjon self (Art. 8)."
        - article [ref=e125]:
          - heading "Velvard welfare" [level=3] [ref=e126]
          - list [ref=e127]:
            - listitem [ref=e128]: ★ Helsahjelp for alle — bred, og gratis wen du brukar den (Art. 10).
            - listitem [ref=e129]: ★ Universitet kan aldri kosta mer als fyr prosent av median jaarinkomst (Art. 11).
            - listitem [ref=e130]: "★ Laphurdeen-Garantien: en fast plikt av hjelp te den tridde-del dat har minst (Art. 13)."
            - listitem [ref=e131]: ★ En lon te leva av, for alle werkare, provat alle jaar (Art. 12).
        - article [ref=e132]:
          - heading "Konsens consensus" [level=3] [ref=e133]
          - list [ref=e134]:
            - listitem [ref=e135]: ★ Ingen lojforslag blivar loj uten 66% av stemmeren in beide kamerer (Art. 20).
            - listitem [ref=e136]: ★ Alle stem av alle medlem er fri, og blivar skrivat open (Art. 20).
            - listitem [ref=e137]: ★ Wen kamereren staar fast, gaar saken te folket (Art. 21).
            - listitem [ref=e138]: ★ Grundlojen self kravar 80% og en folkstemming for veksling (Art. 43).
      - generic [ref=e139]:
