    - generic [ref=f1e46]:
      - paragraph [ref=f1e47]: Fra mange strander
      - heading "The Anchorage" [level=2] [ref=f1e48]
      - generic [ref=f1e49]:
        - paragraph [ref=f1e50]:
          - emphasis [ref=f1e51]: Laphurdeen
          - text: means
          - strong [ref=f1e52]: “The Anchorage.”
          - text: Old Charter
          - emphasis [ref=f1e53]: La Fjärde
          - text: — a French article wrapped around a Swedish word for a wide, sheltered bay — became
          - emphasis [ref=f1e54]: Laphurde
          - text: ", and the archaic definite ending"
          - emphasis [ref=f1e55]: "-een"
          - text: made it a name. It commemorates the bay where the founding fleet first dropped anchor.
        - paragraph [ref=f1e56]:
          - text: "Four fleets came — English, Dutch, Swedish, and French-speaking — and chose to be one people. The Constitution’s preamble still says it plainly: a nation built"
          - strong [ref=f1e57]: “bound by choice rather than by blood.”
          - text: You can hear all four shores in every sentence of Laphurdi, the national language they braided together.
      - generic [ref=f1e58]:
        - article [ref=f1e59]:
          - heading "Lapentieur “the place of slopes”" [level=3] [ref=f1e60]:
            - text: Lapentieur
            - generic [ref=f1e61]: “the place of slopes”
          - paragraph [ref=f1e62]:
            - text: The capital. A fog-brushed hill city stacked above its harbour — French
            - emphasis [ref=f1e63]: la pente
            - text: ", “the slope,” plus the Old Charter place-suffix"
            - emphasis [ref=f1e64]: "-ieur"
            - text: . The white star on the flag is Lapentieur’s harbour light, the star the Charter fleet steered by.
        - article [ref=f1e65]:
          - heading "Darcambria “the amber curve”" [level=3] [ref=f1e66]:
            - text: Darcambria
            - generic [ref=f1e67]: “the amber curve”
          - paragraph [ref=f1e68]:
            - text: The chartered principal city, wrapped around a great curved harbour famous for amber summer sunsets —
            - emphasis [ref=f1e69]: dar
            - text: ", amber, plus"
            - emphasis [ref=f1e70]: cambria
            - text: ", the curve. The amber arc on the flag is Darcambria’s bay at dusk."
    - generic [ref=f1e72]:
      - paragraph [ref=f1e73]: Konsensdemokrati
      - heading "A nation with no ruler" [level=2] [ref=f1e74]
      - paragraph [ref=f1e75]:
        - text: "Article 1 of the Constitution is blunt:"
        - emphasis [ref=f1e76]: “There shall be no President, Prime Minister, monarch, or any other singular head of state or head of government.”
        - text: Laphurdeen is a parliamentary consensus democracy — power is held collectively, exercised openly, and lent, never owned.
      - generic [ref=f1e77]:
        - generic [ref=f1e78]:
          - generic [ref=f1e79]: "0"
          - text: singular rulers — forbidden by Article 1
        - generic [ref=f1e80]:
          - generic [ref=f1e81]: 66%
          - text: of votes in both chambers to pass any law — Article 20
        - generic [ref=f1e82]:
          - generic [ref=f1e83]: "12"
          - text: ministries, each run by a college of elected ministers — Article 24
        - generic [ref=f1e84]:
          - generic [ref=f1e85]: 100%
          - text: of Parliament directly elected by ranked-choice vote — Article 17
      - generic [ref=f1e86]:
        - article [ref=f1e87]:
          - heading "You elect the ministers themselves" [level=3] [ref=f1e88]
          - paragraph [ref=f1e89]:
            - text: Every Senator is a
            - strong [ref=f1e90]: Lead Minister
            - text: ", elected by national popular vote to a named seat in a specific ministry (Article 18). Nobody appoints the health minister here — the country votes them in, by name."
        - article [ref=f1e91]:
          - heading "The Commons does real work" [level=3] [ref=f1e92]
          - paragraph [ref=f1e93]: Three members per province, and every one of them holds a working managerial office inside a ministry while serving (Article 19). No career spectators.
        - article [ref=f1e94]:
          - heading "A head of state who only waves" [level=3] [ref=f1e95]
          - paragraph [ref=f1e96]:
            - text: The Speaker of the Commons is the ceremonial head of state — presiding, promulgating, receiving ambassadors — and holds
            - strong [ref=f1e97]: no executive power at all
            - text: (Article 27).
        - article [ref=f1e98]:
          - heading "No veto. Nobody’s." [level=3] [ref=f1e99]
          - paragraph [ref=f1e100]:
            - text: Once both chambers agree by 66%, a bill becomes law.
            - emphasis [ref=f1e101]: “No person or office holds a power of veto over an act of Parliament”
            - text: (Article 22). If the chambers deadlock, the people settle it by referendum (Article 21).
        - article [ref=f1e102]:
          - heading "Glass-walled government" [level=3] [ref=f1e103]
          - paragraph [ref=f1e104]: Every legislator’s assets sit in a public register, all lobbying is recorded, campaign money is disclosed in real time, and an Integrity Commission with the powers of a standing royal commission watches everyone — including judges (Articles 32–33).
        - article [ref=f1e105]:
          - heading "And you can take it all back" [level=3] [ref=f1e106]
          - paragraph [ref=f1e107]: Electors can recall any member of Parliament, mid-term, by petition and recall vote (Article 23). Consent here is continuous, not quadrennial.
      - figure "Darbogen — “The Amber Curve.” The founding bay at sunset beneath the light of Lapentieur; fixed by law under Article 5. The anthem is Sang av de Mange Strander — the Song of the Many Shores." [ref=f1e108]:
        - 'img "The flag of Laphurdeen: a deep sea-blue field, a broad amber arc across the lower third, and a single white star above the arc" [ref=f1e109]'
        - generic [ref=f1e113]:
          - strong [ref=f1e114]: Darbogen
          - text: — “The Amber Curve.” The founding bay at sunset beneath the light of Lapentieur; fixed by law under Article 5. The anthem is
          - emphasis [ref=f1e115]: Sang av de Mange Strander
          - text: — the Song of the Many Shores.
    - generic [ref=f1e117]:
      - paragraph [ref=f1e118]: Frihed, Velvard, Konsens
      - heading "Three words on every coin" [level=2] [ref=f1e119]
      - paragraph [ref=f1e120]: The national motto isn’t decoration — it’s the Constitution’s table of contents.
      - generic [ref=f1e121]:
        - article [ref=f1e122]:
          - heading "Frihed freedom" [level=3] [ref=f1e123]
          - list [ref=f1e124]:
            - listitem [ref=f1e125]: ★ No criminal penalty for the content of speech — no blasphemy law, no lèse-majesté, ever (Art. 7).
            - listitem [ref=f1e126]: ★ A free and plural press, with protected sources (Art. 7).
            - listitem [ref=f1e127]: ★ Mass surveillance is constitutionally prohibited (Art. 9).
            - listitem [ref=f1e128]: "★ Believe anything, or nothing: the Commonwealth has no established religion (Art. 8)."
        - article [ref=f1e129]:
          - heading "Velvard welfare" [level=3] [ref=f1e130]
          - list [ref=f1e131]:
            - listitem [ref=f1e132]: ★ Universal healthcare, comprehensive and free at the point of use (Art. 10).
            - listitem [ref=f1e133]: ★ University tuition capped at 4% of median income per year (Art. 11).
            - listitem [ref=f1e134]: "★ The Laphurdeen Guarantee: an enforceable duty of care to the least-advantaged third (Art. 13)."
            - listitem [ref=f1e135]: ★ A living wage, reviewed annually, for every worker (Art. 12).
        - article [ref=f1e136]:
          - heading "Konsens consensus" [level=3] [ref=f1e137]
          - list [ref=f1e138]:
            - listitem [ref=f1e139]: ★ No law passes without 66% of votes cast in each chamber (Art. 20).
            - listitem [ref=f1e140]: ★ Every vote of every member is free and recorded (Art. 20).
            - listitem [ref=f1e141]: ★ Deadlocks go to the people by binding referendum (Art. 21).
            - listitem [ref=f1e142]: ★ Amending the Constitution takes 80% of Parliament and a national referendum (Art. 43).
      - generic [ref=f1e143]:
        - heading "From the Charter of Rights and Freedoms" [level=3] [ref=f1e144]
        - list [ref=f1e145]:
          - listitem [ref=f1e146]: § “The dignity of every person is inviolable.” — Art. 6(1)
          - listitem [ref=f1e147]: § Marriage and civil union open to any two consenting adults — Art. 6(4)
          - listitem [ref=f1e148]: § Gender recognition by simple self-determination — Art. 6(5)
          - listitem [ref=f1e149]: § Accessibility is an enforceable right; denying accommodation is discrimination — Art. 6(6)
          - listitem [ref=f1e150]: § The death penalty is abolished and may never be reintroduced — Art. 15(3)
          - listitem [ref=f1e151]: § Dual citizenship welcome; no one may be made stateless — Art. 39
    - generic [ref=f1e153]:
      - paragraph [ref=f1e154]: Practicalities, constitutionally guaranteed
      - heading "Rights you can feel on holiday" [level=2] [ref=f1e155]
      - generic [ref=f1e156]:
        - article [ref=f1e157]:
          - heading "The price is the price" [level=3] [ref=f1e158]
          - paragraph [ref=f1e159]:
            - text: Sales tax is included in every displayed price
            - emphasis [ref=f1e160]: by constitutional command
            - text: (Art. 35(4)). The number on the menu is the number on the bill. Tipping is a kindness, not a rescue.
        - article [ref=f1e161]:
          - heading "You won’t need a car" [level=3] [ref=f1e162]
          - paragraph [ref=f1e163]: Frequent, fully accessible public transport reaching substantially the whole Commonwealth is a constitutional right, with fares capped by law (Art. 14). Ferries count.
        - article [ref=f1e164]:
          - heading "Arithmetic-free money" [level=3] [ref=f1e165]
          - paragraph [ref=f1e166]:
            - text: The krona is pegged at
            - strong [ref=f1e167]: Kr. 100 = US$ 1
            - text: (Art. 38). A Kr. 450 harbour lunch is $4.50 — divide by one hundred and order another bier.
        - article [ref=f1e168]:
          - heading "Two languages, one welcome" [level=3] [ref=f1e169]
          - paragraph [ref=f1e170]: Laphurdi is the national language; English is co-official (Art. 4). Every sign, timetable, and menu speaks both. Try the Laphurdi anyway — it opens doors.
