    - generic [ref=f1e18]:
      - generic [ref=f1e19]:
        - paragraph [ref=f1e20]: Samveldet Laphurdeen · The Commonwealth of Laphurdeen
        - heading "Velkom te Laphurdeen" [level=1] [ref=f1e21]
        - paragraph [ref=f1e22]:
          - text: An archipelago in the middle of the Mediterranean, founded by settlers from many shores — and the only country you will ever visit with
          - strong [ref=f1e23]: no president, no prime minister, no monarch,
          - text: and no one left behind.
        - paragraph [ref=f1e24]:
          - text: Frihed · Velvard · Konsens
          - generic [ref=f1e25]: Freedom · Welfare · Consensus
