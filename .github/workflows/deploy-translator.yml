name: Deploy translator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/translator/**"
      - "LEXICON.tsv"
      - ".github/workflows/deploy-translator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/translator/package-lock.json
      - run: npm ci
        working-directory: apps/translator
      - run: npm test
        working-directory: apps/translator
      - run: npm run build
        working-directory: apps/translator
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/translator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
